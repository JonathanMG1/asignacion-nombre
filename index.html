<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asignación de equipos</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="page">
    <header>
      <h1>Asignación de equipos</h1>
      <p>Genera el nombre del equipo automáticamente.</p>
    </header>

    <div class="card">
      <p class="card-label">01 — Colaborador</p>

      <!-- Modo -->
      <div class="field">
        <label>Tipo de Nombre</label>
        <select id="modo" onchange="onModoChange()">
          <option value="NOMINAL">Persona</option>
          <option value="GENERICO">Genérico</option>
        </select>
      </div>

      <!-- Nombre (modo Nominal) -->
      <div class="field" id="campo-nombre">
        <label>Nombre y Apellido</label>
        <input type="text" id="nombre" placeholder="Ej: Juanito Perez" oninput="calcular()" />
      </div>

      <!-- Genérico (modo Genérico) -->
      <div class="field" id="campo-generico" style="display:none;">
        <label>Área</label>
        <select id="generico" onchange="calcular()">
          <option value="">Seleccionar</option>
        </select>
      </div>

      <!-- Gerencia -->
      <div class="field">
        <label>Gerencia</label>
        <select id="gerencia" onchange="calcular()">
          <option value="">Seleccionar</option>
        </select>
      </div>

    </div>

    <div class="card">
      <p class="card-label">02 — Equipo</p>
      <div class="row3">
        <div class="field">
          <label>Tipo de asignación</label>
          <select id="tipo" onchange="calcular()"></select>
        </div>
        <div class="field">
          <label>Equipo</label>
          <select id="equipo" onchange="calcular(); calcularEquipo()"></select>
        </div>
        <div class="field">
          <label>Ciudad</label>
          <select id="ciudad" onchange="calcular()"></select>
        </div>
      </div>
    </div>
    <div class="card">

      <p class="card-label">03 — Nombre asignacion</p>

      <div class="row3" style="margin-top:12px;">
        <div class="field">
          <label>Marca</label>
          <select id="marca" onchange="onMarcaChange()">
            <option value="">Seleccionar</option>
          </select>
        </div>
        <div class="field">

          <div class="field">
            <label>Modelo</label>
            <div class="autocomplete-wrap">
              <input type="text" id="modelo" placeholder="Escribe para buscar..." autocomplete="off"
                oninput="onModeloInput()" onkeydown="onModeloKey(event)" onblur="onModeloBlur()" />
              <div class="autocomplete-list" id="ac-modelo-list"></div>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Serie</label>
          <input type="text" id="serie" placeholder="Ej: PF3XY1A2" oninput="calcularEquipo()" />
        </div>
      </div>
    </div>
    <div class="result-card" id="result-card">
      <p class="result-label">Nombre generado</p>
      <p class="result-code" id="result-code">—</p>
      <div class="pills" id="pills"></div>
      <button class="copy-btn" id="copy-btn" onclick="copiar()">Copiar nombre</button>
    </div>
    <div class="result-card" id="result-card-equipo" style="margin-top:1rem;">
      <p class="result-label">Nombre de equipo</p>
      <p class="result-code" id="result-code-equipo">—</p>
      <div class="pills" id="pills-equipo"></div>
      <button class="copy-btn" id="copy-btn-equipo" onclick="copiarEquipo()">Copiar nombre</button>
    </div>
  </div>

  <script src="js/options.js"></script>
  <script src="js/function.js"></script>
  <script src="js/options.js"></script>
  <script src="js/function.js"></script>
  <script>
    inicializarSelects();
  </script>
</body>
</body>

</html>
